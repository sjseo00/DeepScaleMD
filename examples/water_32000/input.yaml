# DeepScaleMD input for Water 32,000 molecules
system:
  type: water
  num_molecules: 32000
  coordinates: coordinates.xyz
forcefield:
  style: charmm
ensemble:
  type: nve # nve, nvt, npt 중 선택
  temperature: 300.0
  pressure: 1.0 # npt에서 사용
simulation:
  steps: 10000
  timestep: 1.0
output:
  thermo_interval: 100
  properties: [energy, temperature, pressure, virial]
