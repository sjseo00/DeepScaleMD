# ============================================================================
# Custom MD Simulation Configuration File
# Simple Lennard-Jones System (32,000 particles)
# ============================================================================


# Basic simulation parameters (required)
coordinate_file: "coordinates.xyz"
topology_file: "topology.top"
target_temperature: 300.0
timestep: 1.0      # 1 fs (LAMMPS units real)
total_steps: 1000  # LAMMPS run 10000


# Simulation box parameters
box_x: 160.0
box_y: 160.0
box_z: 160.0
periodic_x: true
periodic_y: true
periodic_z: true


# Output configuration
output_prefix: simulation
trajectory_output_freq: 100
trajectory_format: xyz                # "xyz", "dump", or "both"
trajectory_include_velocities: false  # Include velocities in trajectory
trajectory_include_forces: false      # Include forces in trajectory
output_freq: 100
output_info: STEP, T, KE, PE


# Force calculation parameters
cutoff_distance: 12.0

# Neighbor list configuration
neighbor_list_type: "verlet_cell_list"
#neighbor_list_type: "morton_hilbert"


verlet_skin: 2.0                          # Verlet list skin distance (for Verlet lists)
neighbor_list_update_freq: 10                     # More frequent rebuild to prevent divergence

# Integration method
integrator: "velocity_verlet"
#integrator: "leapfrog"
#integrator: "r_respa"


# Thermostat (disabled for NVE simulation)
thermostat: "none"


# Barostat (disabled for NVE simulation)
barostat: "none"


# Force calculation section
force_calculation:
  mode: "builtin"
  enable_bonds: false
  enable_angles: false
  enable_dihedrals: false
  enable_lennard_jones: true
  enable_coulomb: false

# Python force interface (disabled)
# python_enabled: false        # or true (Enable Python forces)
# python_force_path: "python_force/" # or "custom_forces/" (Path to Python modules)
